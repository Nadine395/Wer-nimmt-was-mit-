<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wer nimmt was mit?</title>
<style>
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#fdf8ee;font-family:"Andika","Comic Sans MS","Segoe UI",Arial,sans-serif;color:#2b2b2b}
  body{display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:8px 16px;background:#ffe9b8;border-bottom:3px solid #f2c14e}
  header h1{font-size:clamp(20px,3vw,30px);margin:0;flex:1}
  .btn{border:none;border-radius:14px;padding:8px 14px;font:inherit;font-size:18px;background:#fff;box-shadow:0 2px 0 #d9a933;cursor:pointer}
  .btn:active{transform:translateY(2px);box-shadow:none}
  #score{font-size:20px;font-weight:bold;white-space:nowrap}

  #zones{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 12px 6px}
  .zone{background:#fff;border:4px dashed #b9c7d8;border-radius:20px;padding:6px;display:flex;flex-direction:column;align-items:center;min-height:clamp(200px,38vh,330px);transition:background .15s,border-color .15s}
  .zone.hover{background:#eaf4ff;border-color:#4a90d9;border-style:solid}
  .zone.good{background:#e3f8e3;border-color:#3aa53a}
  .zone.bad{animation:shake .4s;border-color:#e05050;background:#fde8e8}
  .zone .veh{height:clamp(70px,13vh,120px);max-width:95%;object-fit:contain;pointer-events:none}
  .zone .name{font-size:clamp(18px,2.4vw,26px);font-weight:bold;margin-top:2px}
  .zone .txt{font-size:clamp(12px,1.4vw,15px);text-align:center;color:#555}
  .zone .packed{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:6px;width:100%}
  .zone .packed img{height:clamp(38px,7vh,62px);max-width:80px;object-fit:contain;animation:pop .35s}

  #tray{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:10px;padding:8px 12px 14px;overflow:hidden}
  .item{width:clamp(100px,11.5vw,140px);background:#fff;border-radius:16px;box-shadow:0 3px 8px rgba(0,0,0,.15);padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;touch-action:none;cursor:grab}
  .item img{height:clamp(56px,11vh,100px);max-width:100%;object-fit:contain;pointer-events:none}
  .item .w{font-size:clamp(13px,1.5vw,17px);margin-top:3px;text-align:center;line-height:1.1;pointer-events:none}
  .dot{display:inline-block;width:.75em;height:.75em;border-radius:50%;margin-right:3px;vertical-align:-1px}
  .der{background:#1f6fd1}.die{background:#e02424}.das{background:#21a84a}.pl{background:#f2d000}
  body.nowords .item .w{display:none}
  .item.ghost{opacity:.25}
  .drag{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.12);box-shadow:0 10px 24px rgba(0,0,0,.3)}
  .back{transition:left .3s ease,top .3s ease}

  #done{position:fixed;inset:0;background:rgba(253,248,238,.94);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;text-align:center}
  #done.show{display:flex}
  #done h2{font-size:clamp(34px,6vw,60px);margin:0 0 6px}
  #stars{font-size:clamp(40px,7vw,70px);letter-spacing:6px}
  #done p{font-size:22px;margin:8px 0 18px}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
  @keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
  .conf{position:fixed;top:-20px;width:12px;height:16px;z-index:101;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>

<header>
  <h1>🧳 Wer nimmt was mit?</h1>
  <button class="btn" id="hear" title="Aufgabe hören">🔊</button>
  <button class="btn" id="words" title="Wörter ein/aus">Abc</button>
  <span id="score">0 / 16</span>
  <button class="btn" id="restart" title="Neu starten">↻</button>
</header>
<div id="zones"></div>
<div id="tray"></div>
<div id="done">

  <div id="stars"></div>
  <p id="doneText"></p>

</div>

const ART={der:'der',die:'die',das:'das',pl:'die'};
const zonesEl=document.getElementById('zones'), trayEl=document.getElementById('tray');
let placed=0, mistakes=0, audio=null;

function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.85;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('de'));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
function tone(ok){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const n=audio.currentTime;
  (ok?[523,659,784]:[220,180]).forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=ok?'sine':'triangle';o.frequency.value=f;
  g.gain.setValueAtTime(.0001,n+i*.1);g.gain.exponentialRampToValueAtTime(.25,n+i*.1+.02);g.gain.exponentialRampToValueAtTime(.0001,n+i*.1+.25);
  o.connect(g).connect(audio.destination);o.start(n+i*.1);o.stop(n+i*.1+.3);});}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function build(){
  placed=0;mistakes=0;zonesEl.innerHTML='';trayEl.innerHTML='';
  document.getElementById('done').classList.remove('show');
  VEHICLES.forEach(v=>{const z=document.createElement('div');z.className='zone';z.dataset.id=v.id;
    z.innerHTML=`<img class="veh" src="${v.img}" alt=""><div class="name">${v.name}</div><div class="txt">${v.text}</div><div class="packed"></div>`;
    z.addEventListener('click',()=>speak(v.name+' '+v.text));zonesEl.appendChild(z);});
  shuffle(ITEMS).forEach(it=>{const d=document.createElement('div');d.className='item';d.dataset.id=it.id;
    d.innerHTML=`<img src="${it.img}" alt=""><div class="w"><span class="dot ${it.art}"></span>${ART[it.art]} ${it.word}</div>`;
    d.addEventListener('pointerdown',e=>startDrag(e,d,it));trayEl.appendChild(d);});
  updScore();
}
function updScore(){document.getElementById('score').textContent=placed+' / '+ITEMS.length;}

let drag=null;
function startDrag(e,el,it){
  if(drag)return; e.preventDefault();
  const r=el.getBoundingClientRect(), c=el.cloneNode(true);
  c.classList.add('drag');c.style.width=r.width+'px';c.style.left=e.clientX+'px';c.style.top=e.clientY+'px';
  document.body.appendChild(c);el.classList.add('ghost');
  drag={el,it,c,sx:e.clientX,sy:e.clientY,ox:r.left+r.width/2,oy:r.top+r.height/2,moved:false,id:e.pointerId};
  try{el.setPointerCapture(e.pointerId);}catch(_){}
  el.onpointermove=moveDrag;el.onpointerup=endDrag;el.onpointercancel=endDrag;
}
function zoneAt(x,y){return [...document.querySelectorAll('.zone')].find(z=>{const r=z.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;});}
function moveDrag(e){if(!drag||e.pointerId!==drag.id)return;
  if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8)drag.moved=true;
  drag.c.style.left=e.clientX+'px';drag.c.style.top=e.clientY+'px';
  const z=zoneAt(e.clientX,e.clientY);document.querySelectorAll('.zone').forEach(q=>q.classList.toggle('hover',q===z));}
function endDrag(e){if(!drag||e.pointerId!==drag.id)return;
  const {el,it,c}=drag; el.onpointermove=el.onpointerup=el.onpointercancel=null;
  document.querySelectorAll('.zone').forEach(q=>q.classList.remove('hover'));
  const z=zoneAt(e.clientX,e.clientY), word=ART[it.art]+' '+it.word;
  if(!drag.moved||!z){ // nur angetippt oder daneben: zurück + Wort vorlesen
    if(!drag.moved)speak(word); goBack(); return;}
  if(it.ok.includes(z.dataset.id)){
    tone(true); c.remove(); el.remove();
    const im=document.createElement('img');im.src=it.img;im.alt=it.word;z.querySelector('.packed').appendChild(im);
    flash(z,'good'); placed++; updScore();
    const v=VEHICLES.find(v=>v.id===z.dataset.id);
    speak(v.name+' nimmt '+(it.art==='pl'?'die':it.art==='der'?'den':it.art)+' '+it.word+' mit.');
    drag=null; if(placed===ITEMS.length)setTimeout(finish,1400);
  } else { tone(false); mistakes++; flash(z,'bad'); goBack(); }
}
function goBack(){const {el,c,ox,oy}=drag;c.classList.add('back');c.style.left=ox+'px';c.style.top=oy+'px';
  setTimeout(()=>{c.remove();el.classList.remove('ghost');},300);drag=null;}
function flash(z,cls){z.classList.remove('good','bad');void z.offsetWidth;z.classList.add(cls);setTimeout(()=>z.classList.remove(cls),700);}

function finish(){
  const s=mistakes<=1?3:mistakes<=4?2:1;
  document.getElementById('stars').textContent='⭐'.repeat(s)+'☆'.repeat(3-s);
  document.getElementById('doneText').textContent=mistakes===0?'Alles richtig eingepackt – ohne Fehler!':'Alles eingepackt! Fehlversuche: '+mistakes;
  document.getElementById('done').classList.add('show');speak('Super gemacht! Alle Kinder können losfahren.');
  const cols=['#e02424','#1f6fd1','#21a84a','#f2d000','#ff8c1a'];
  for(let i=0;i<60;i++){const p=document.createElement('div');p.className='conf';p.style.left=Math.random()*100+'vw';
    p.style.background=cols[i%5];p.style.animationDuration=(1.8+Math.random()*1.8)+'s';p.style.animationDelay=Math.random()*.6+'s';
    document.body.appendChild(p);setTimeout(()=>p.remove(),4500);}
}
document.getElementById('hear').onclick=()=>speak('Wer nimmt was mit? Ziehe jedes Bild zum richtigen Kind.');
document.getElementById('words').onclick=()=>document.body.classList.toggle('nowords');
document.getElementById('restart').onclick=build;
document.getElementById('again').onclick=build;
document.addEventListener('touchmove',e=>{if(drag)e.preventDefault();},{passive:false});
if('speechSynthesis' in window)speechSynthesis.getVoices();
build();
</script>
</body>
</html>
